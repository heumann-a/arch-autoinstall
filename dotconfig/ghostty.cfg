# Config syntax crash course
# ==========================
# # The config file consists of simple key-value pairs,
# # separated by equals signs.
# font-family = Iosevka
# window-padding-x = 2
#
# # Spacing around the equals sign does not matter.
# # All of these are identical:
# key=value
# key= value
# key =value
# key = value
#
# # Any line beginning with a # is a comment. It's not possible to put
# # a comment after a config option, since it would be interpreted as a
# # part of the value. For example, this will have a value of "#123abc":
# background = #123abc
#
# # Empty values are used to reset config keys to default.
# key =
#
# # Some config options have unique syntaxes for their value,
# # which is explained in the docs for that config option.
# # Just for example:
# resize-overlay-duration = 4s 200ms


# === Theme Configuration ===
theme = Sonokai
background = #2c2e34
foreground = #e2e2e3
selection-background = #414550
selection-foreground = #e2e2e3
cursor-color = #e2e2e3
cursor-text = #2c2e34
palette = 0=#181819
palette = 1=#fc5d7c
palette = 2=#9ed072
palette = 3=#e7c664
palette = 4=#76cce0
palette = 5=#b39df3
palette = 6=#f39660
palette = 7=#e2e2e3
palette = 8=#7f8490
palette = 9=#fc5d7c
palette = 10=#9ed072
palette = 11=#e7c664
palette = 12=#76cce0
palette = 13=#b39df3
palette = 14=#f39660
palette = 15=#e2e2e3

# === Shell Integration ===
shell-integration = "zsh"           
shell-integration-features = "ssh-env"           



# === Keybinds ===
keybind = ctrl+n=new_window
keybind = ctrl+t=new_tab

keybind = alt+u=previous_tab
keybind = alt+o=next_tab

keybind = alt+i=goto_split:top
keybind = alt+j=goto_split:left
keybind = alt+k=goto_split:bottom
keybind = alt+l=goto_split:right

keybind = alt+m>i=new_split:up
keybind = alt+m>j=new_split:left
keybind = alt+m>k=new_split:down
keybind = alt+m>l=new_split:right
keybind = alt+m>f=toggle_split_zoom


keybind = super+r=reload_config

window-save-state = always